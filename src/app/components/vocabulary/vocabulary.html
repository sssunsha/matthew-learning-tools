<div class="category-container vocabulary-theme">
  <div class="category-header">
    <button mat-icon-button class="back-btn" (click)="goBack()">
      <mat-icon>arrow_back</mat-icon>
    </button>
    <h1 class="category-title">背单词</h1>
    <p class="category-subtitle">Vocabulary Learning</p>
  </div>

  <div class="metro-grid">
    <!-- 小学三年级上 -->
    <div class="metro-tile tile-large grade-3" (click)="openGrade('3-1')">
      <div class="tile-content">
        <mat-icon class="tile-icon">looks_3</mat-icon>
        <div class="tile-text">
          <h2>三年级上</h2>
          <p>Grade 3 - Term 1</p>
        </div>
      </div>
    </div>

    <!-- 小学三年级下 -->
    <div class="metro-tile tile-large grade-3" (click)="openGrade('3-2')">
      <div class="tile-content">
        <mat-icon class="tile-icon">looks_3</mat-icon>
        <div class="tile-text">
          <h2>三年级下</h2>
          <p>Grade 3 - Term 2</p>
        </div>
      </div>
    </div>

    <!-- 小学四年级上 -->
