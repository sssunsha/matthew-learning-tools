<div class="metro-home-container">
  <div class="metro-header">
    <h1 class="metro-title">马修学习小工具</h1>
    <p class="metro-subtitle">Matthew Learning Tools</p>
  </div>

  <div class="metro-grid">
    <!-- 语文 -->
    <div class="metro-tile tile-large tile-chinese" (click)="openCategory('chinese')">
      <div class="tile-content">
        <mat-icon class="tile-icon">menu_book</mat-icon>
        <div class="tile-text">
          <h2>语文</h2>
          <p>Chinese</p>
        </div>
      </div>
    </div>

    <!-- 数学 -->
    <div class="metro-tile tile-large tile-math" (click)="openCategory('math')">
      <div class="tile-content">
        <mat-icon class="tile-icon">calculate</mat-icon>
        <div class="tile-text">
          <h2>数学</h2>
          <p>Mathematics</p>
        </div>
      </div>
    </div>

    <!-- 英语 -->
    <div class="metro-tile tile-large tile-english" (click)="openCategory('english')">
      <div class="tile-content">
        <mat-icon class="tile-icon">translate</mat-icon>
        <div class="tile-text">
          <h2>英语</h2>
          <p>English</p>
        </div>
      </div>
    </div>

    <!-- 记录 -->
    <div class="metro-tile tile-large tile-notes" (click)="openCategory('notes')">
      <div class="tile-content">
        <mat-icon class="tile-icon">edit_note</mat-icon>
        <div class="tile-text">
          <h2>记录</h2>
          <p>Notes</p>
        </div>
      </div>
    </div>

    <!-- 娱乐 -->
    <div class="metro-tile tile-large tile-entertainment" (click)="openCategory('entertainment')">
      <div class="tile-content">
        <mat-icon class="tile-icon">celebration</mat-icon>
        <div class="tile-text">
          <h2>娱乐</h2>
          <p>Entertainment</p>
        </div>
      </div>
    </div>

    <!-- 推荐 -->
    <div class="metro-tile tile-large tile-recommend" (click)="openCategory('recommend')">
      <div class="tile-content">
        <mat-icon class="tile-icon">star</mat-icon>
        <div class="tile-text">
          <h2>推荐</h2>
          <p>Recommend</p>
        </div>
      </div>
    </div>

    <!-- AI -->
    <div class="metro-tile tile-large tile-ai" (click)="openCategory('ai')">
      <div class="tile-content">
        <mat-icon class="tile-icon">psychology</mat-icon>
        <div class="tile-text">
          <h2>AI</h2>
          <p>Artificial Intelligence</p>
        </div>
      </div>
    </div>

    <!-- 科学 -->
    <div class="metro-tile tile-large tile-science" (click)="openCategory('science')">
      <div class="tile-content">
        <mat-icon class="tile-icon">science</mat-icon>
        <div class="tile-text">
          <h2>科学</h2>
          <p>Science</p>
        </div>
      </div>
    </div>

    <!-- 体育 -->
    <div class="metro-tile tile-large tile-sports" (click)="openCategory('sports')">
      <div class="tile-content">
        <mat-icon class="tile-icon">sports_soccer</mat-icon>
        <div class="tile-text">
          <h2>体育</h2>
          <p>Sports</p>
        </div>
      </div>
    </div>
  </div>
</div>
