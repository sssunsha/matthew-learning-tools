<div class="metro-home-container">
  <div class="metro-header">
    <div class="header-content">
      <div class="header-text">
        <h1 class="metro-title">马修学习小工具 <span class="version">v{{ version }}</span></h1>
        <p class="metro-subtitle metro-subtitle-desktop">Matthew Learning Tools</p>
      </div>
      <div class="header-actions">
        <button class="icon-button" (click)="openCamera()" title="拍照">
          <mat-icon>photo_camera</mat-icon>
        </button>
        <button class="icon-button schedule-button" (click)="openSchedule()" title="课程表">
          <mat-icon>calendar_today</mat-icon>
        </button>
        <button class="icon-button" (click)="openStatistics()" title="统计">
          <mat-icon>bar_chart</mat-icon>
        </button>
        <button class="icon-button" (click)="openSettings()" title="设置">
          <mat-icon>settings</mat-icon>
        </button>
      </div>
    </div>
  </div>

  <div class="metro-grid">
    <!-- 语文 -->
    <div class="metro-tile tile-large tile-chinese" (click)="openCategory('chinese')">
      <div class="tile-content">
        <mat-icon class="tile-icon">menu_book</mat-icon>
        <div class="tile-text">
          <h2>语文</h2>
          <p>Chinese</p>
        </div>
      </div>
    </div>

    <!-- 数学 -->
    <div class="metro-tile tile-large tile-math" (click)="openCategory('math')">
      <div class="tile-content">
        <mat-icon class="tile-icon">calculate</mat-icon>
        <div class="tile-text">
          <h2>数学</h2>
          <p>Mathematics</p>
        </div>
      </div>
    </div>

    <!-- 英语 -->
    <div class="metro-tile tile-large tile-english" (click)="openCategory('english')">
      <div class="tile-content">
        <mat-icon class="tile-icon">translate</mat-icon>
        <div class="tile-text">
          <h2>英语</h2>
          <p>English</p>
        </div>
      </div>
    </div>

    <!-- 其他学科 -->
    <div class="metro-tile tile-large tile-other-subjects" (click)="openCategory('other-subjects')">
      <div class="tile-content">
        <mat-icon class="tile-icon">school</mat-icon>
        <div class="tile-text">
          <h2>其他学科</h2>
          <p>Other Subjects</p>
        </div>
      </div>
    </div>

    <!-- 娱乐 -->
    <div class="metro-tile tile-large tile-entertainment" (click)="openCategory('entertainment')">
      <div class="tile-content">
        <mat-icon class="tile-icon">celebration</mat-icon>
        <div class="tile-text">
          <h2>娱乐</h2>
          <p>Entertainment</p>
        </div>
      </div>
    </div>

    <!-- 记录 -->
    <div class="metro-tile tile-large tile-notes" (click)="openCategory('notes')">
      <div class="tile-content">
        <mat-icon class="tile-icon">edit_note</mat-icon>
        <div class="tile-text">
          <h2>记录</h2>
          <p>Notes</p>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Schedule Modal -->
<div class="schedule-modal" *ngIf="isScheduleVisible" (click)="closeSchedule()">
  <div class="schedule-content">
    <img src="assets/resources/others/课程表.jpg" alt="课程表" />
  </div>
</div>
