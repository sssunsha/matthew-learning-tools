<div class="category-container chinese-theme">
  <div class="category-header">
    <button mat-icon-button class="back-btn" (click)="goBack()">
      <mat-icon>arrow_back</mat-icon>
    </button>
    <h1 class="category-title">语文</h1>
    <p class="category-subtitle">Chinese</p>
    <button mat-icon-button class="camera-btn-header" (click)="openCamera()" title="拍照">
      <mat-icon>photo_camera</mat-icon>
    </button>
  </div>

  <div class="metro-grid">
    <!-- 三下生字表 -->
    <div class="metro-tile tile-medium" (click)="navigateToCharacterTable()">
      <div class="tile-content">
        <mat-icon class="tile-icon">menu_book</mat-icon>
        <h3>三下生字表</h3>
      </div>
    </div>

    <!-- 三下晨读单 -->
    <div class="metro-tile tile-medium" (click)="navigateToMorningReading()">
      <div class="tile-content">
        <mat-icon class="tile-icon">wb_sunny</mat-icon>
        <h3>三下晨读单</h3>
      </div>
    </div>
  </div>
</div>
