<div class="category-container grade3-term2-theme">
  <div class="category-header">
    <button mat-icon-button class="back-btn" (click)="goBack()">
      <mat-icon>arrow_back</mat-icon>
    </button>
    <h1 class="category-title">三年级下</h1>
    <p class="category-subtitle">Grade 3 Term 2</p>
  </div>

  <div class="metro-grid">
    <!-- 学课文磁贴 -->
    <div class="metro-tile tile-large tile-green-dark" (click)="openLearnTexts()">
      <div class="tile-content">
        <mat-icon class="tile-icon">import_contacts</mat-icon>
        <div class="tile-text">
          <h2>学课文</h2>
          <p>Learn Texts</p>
        </div>
      </div>
    </div>

    <!-- 背单词磁贴 -->
    <div class="metro-tile tile-large tile-green" (click)="openVocabulary()">
      <div class="tile-content">
        <mat-icon class="tile-icon">menu_book</mat-icon>
        <div class="tile-text">
          <h2>背单词</h2>
          <p>Vocabulary</p>
        </div>
      </div>
    </div>

    <!-- 知识清单磁贴 -->
    <div class="metro-tile tile-large tile-green-light" (click)="openKnowledgeList()">
      <div class="tile-content">
        <mat-icon class="tile-icon">checklist</mat-icon>
        <div class="tile-text">
          <h2>知识清单</h2>
          <p>Knowledge List</p>
        </div>
      </div>
    </div>
  </div>
</div>
