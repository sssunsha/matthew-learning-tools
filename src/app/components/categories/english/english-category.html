<div class="category-container english-theme">
  <div class="category-header">
    <button mat-icon-button class="back-btn" (click)="goBack()">
      <mat-icon>arrow_back</mat-icon>
    </button>
    <h1 class="category-title">英语</h1>
    <p class="category-subtitle">English</p>
    <button mat-icon-button class="camera-btn-header" (click)="openCamera()" title="拍照">
      <mat-icon>photo_camera</mat-icon>
    </button>
  </div>

  <div class="metro-grid">
    <!-- 三年级下磁贴 -->
    <div class="metro-tile tile-large tile-green-dark" (click)="openGrade3Term2()">
      <div class="tile-content">
        <mat-icon class="tile-icon">school</mat-icon>
        <div class="tile-text">
          <h2>三年级下</h2>
          <p>Grade 3 Term 2</p>
        </div>
        <div class="tile-features">
          <span class="feature-tag">学课文</span>
          <span class="feature-tag">背单词</span>
          <span class="feature-tag">知识清单</span>
        </div>
      </div>
    </div>

    <!-- 分割线 -->
    <div class="divider-line"></div>

    <!-- 基础学习磁贴 -->
    <div class="metro-tile tile-large" (click)="openBasicLearning()">
      <div class="tile-content">
        <mat-icon class="tile-icon">school</mat-icon>
        <div class="tile-text">
          <h2>基础学习</h2>
          <p>Basic Learning</p>
        </div>
      </div>
    </div>

    <!-- 背单词磁贴 -->
    <div class="metro-tile tile-large" (click)="openVocabulary()">
      <div class="tile-content">
        <mat-icon class="tile-icon">menu_book</mat-icon>
        <div class="tile-text">
          <h2>背单词</h2>
          <p>Vocabulary Learning</p>
        </div>
      </div>
    </div>
  </div>
</div>
