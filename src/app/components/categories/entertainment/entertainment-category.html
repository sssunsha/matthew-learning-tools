<div class="category-container entertainment-theme">
  <div class="category-header">
    <button mat-icon-button class="back-btn" (click)="goBack()">
      <mat-icon>arrow_back</mat-icon>
    </button>
    <h1 class="category-title">娱乐</h1>
    <p class="category-subtitle">Entertainment</p>
  </div>

  <div class="metro-grid">
    <!-- 俄罗斯方块 -->
    <div class="metro-tile tile-medium" (click)="openTetris()">
      <div class="tile-content">
        <mat-icon class="tile-icon">extension</mat-icon>
        <div class="tile-text">
          <h2>俄罗斯方块</h2>
          <p>Tetris Game</p>
        </div>
      </div>
    </div>

    <!-- 鹦鹉训练 -->
    <div class="metro-tile tile-medium" (click)="openParrotTraining()">
      <div class="tile-content">
        <mat-icon class="tile-icon">pets</mat-icon>
        <div class="tile-text">
          <h2>鹦鹉训练</h2>
          <p>Parrot Training</p>
        </div>
      </div>
    </div>

    <!-- pixabay素材网 -->
    <div class="metro-tile tile-medium" (click)="openPixabay()">
      <div class="tile-content">
        <mat-icon class="tile-icon">library_music</mat-icon>
        <div class="tile-text">
          <h2>pixabay素材网</h2>
          <p>Sound &amp; Image Resources</p>
        </div>
      </div>
    </div>

    <!-- 五子棋 -->
    <div class="metro-tile tile-medium" (click)="openGomoku()">
      <div class="tile-content">
        <mat-icon class="tile-icon">grid_on</mat-icon>
        <div class="tile-text">
          <h2>五子棋</h2>
          <p>Gomoku Game</p>
        </div>
      </div>
    </div>

    <!-- 算24点 -->
    <div class="metro-tile tile-medium" (click)="openCalc24()">
      <div class="tile-content">
        <mat-icon class="tile-icon">style</mat-icon>
        <div class="tile-text">
          <h2>算24点</h2>
          <p>Calculate 24</p>
        </div>
      </div>
    </div>
  </div>
</div>
