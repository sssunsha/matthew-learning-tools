<div class="sudoku-container">

  @if (viewMode === 'level-select') {
    <div class="page-header">
      <button mat-icon-button class="back-btn" (click)="goBack()">
        <mat-icon>arrow_back</mat-icon>
      </button>
      <div class="header-titles">
        <h1 class="page-title">数独游戏</h1>
        <p class="page-subtitle">Sudoku</p>
      </div>
    </div>

    <div class="level-grid">
      @for (level of levels; track level.id) {
        <div class="level-card"
          [class.unlocked]="isLevelUnlocked(level.id)"
          [class.locked]="!isLevelUnlocked(level.id)"
          [class.completed]="getLevelProgress(level.id) >= puzzlesPerLevel"
          (click)="startLevel(level)">
          <div [class]="'level-badge ' + level.theme">{{ level.subtitle }}</div>
          <div class="level-name">{{ level.name }}</div>
          <div class="level-progress-row">
            @if (!isLevelUnlocked(level.id)) {
              <mat-icon class="lock-icon">lock</mat-icon>
            } @else {
              <div class="progress-bar">
                <div class="progress-fill"
                  [style.width.%]="getLevelProgress(level.id) / puzzlesPerLevel * 100">
                </div>
              </div>
              <span class="progress-text">
                {{ getLevelProgress(level.id) }}/{{ puzzlesPerLevel }}
              </span>
            }
          </div>
        </div>
      }
    </div>
  }

  @if (viewMode === 'game') {
    <p>游戏视图（Task 4 实现）</p>
  }

</div>
