<div class="category-container math-theme">
  <div class="category-header">
    <button mat-icon-button class="back-btn" (click)="goBack()">
      <mat-icon>arrow_back</mat-icon>
    </button>
    <h1 class="category-title">数学</h1>
    <p class="category-subtitle">Mathematics</p>
    <button mat-icon-button class="settings-btn-header" (click)="openSettings()" title="设置">
      <mat-icon>settings</mat-icon>
    </button>
    <button mat-icon-button class="camera-btn-header" (click)="openCamera()" title="拍照">
      <mat-icon>photo_camera</mat-icon>
    </button>
  </div>

  <div class="metro-grid">
    <!-- 1. 19×19运算表（有功能） -->
    <div class="metro-tile tile-medium" (click)="openMultiplicationTable()">
      <div class="tile-content">
        <mat-icon class="tile-icon">grid_on</mat-icon>
        <div class="tile-text">
          <h2>19×19运算表</h2>
          <p>Multiplication Table</p>
        </div>
      </div>
    </div>

    <!-- 2. 快速计算（有功能） -->
    <div class="metro-tile tile-medium" (click)="openQuickCalculation()">
      <div class="tile-content">
        <mat-icon class="tile-icon">speed</mat-icon>
        <div class="tile-text">
          <h2>快速计算</h2>
          <p>Quick Calculation</p>
        </div>
      </div>
    </div>

    <!-- 3. 基础运算游戏 -->
    <div class="metro-tile tile-medium" (click)="openBasicOperationsGame()">
      <div class="tile-content">
        <mat-icon class="tile-icon">calculate</mat-icon>
        <div class="tile-text">
          <h2>基础运算游戏</h2>
          <p>Basic Operations Game</p>
        </div>
      </div>
    </div>

    <!-- 4. 解方程 -->
    <div class="metro-tile tile-medium" (click)="openSolveEquations()">
      <div class="tile-content">
        <mat-icon class="tile-icon">functions</mat-icon>
        <div class="tile-text">
          <h2>解方程</h2>
          <p>Solve Equations</p>
        </div>
      </div>
    </div>

    <!-- 数独游戏 -->
    <div class="metro-tile tile-medium" (click)="openSudoku()">
      <div class="tile-content">
        <mat-icon class="tile-icon">grid_4x4</mat-icon>
        <div class="tile-text">
          <h2>数独游戏</h2>
          <p>Sudoku</p>
        </div>
      </div>
    </div>
  </div>
</div>
