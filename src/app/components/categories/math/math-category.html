<div class="category-container math-theme">
  <div class="category-header">
    <button mat-icon-button class="back-btn" (click)="goBack()">
      <mat-icon>arrow_back</mat-icon>
    </button>
    <h1 class="category-title">数学</h1>
    <p class="category-subtitle">Mathematics</p>
  </div>

  <div class="metro-grid">
    <!-- 1. 19×19运算表（有功能） -->
    <div class="metro-tile tile-large" (click)="openMultiplicationTable()">
      <div class="tile-content">
        <mat-icon class="tile-icon">grid_on</mat-icon>
        <div class="tile-text">
          <h2>19×19运算表</h2>
          <p>Multiplication Table</p>
        </div>
      </div>
    </div>

    <!-- 2-15 其他数学工具磁贴（只显示图标） -->
    <div class="metro-tile tile-large">
      <div class="tile-content">
        <mat-icon class="tile-icon">calculate</mat-icon>
      </div>
    </div>

    <div class="metro-tile tile-large">
      <div class="tile-content">
        <mat-icon class="tile-icon">functions</mat-icon>
      </div>
    </div>

    <div class="metro-tile tile-large">
      <div class="tile-content">
        <mat-icon class="tile-icon">percent</mat-icon>
      </div>
    </div>

    <div class="metro-tile tile-medium">
      <div class="tile-content">
        <mat-icon class="tile-icon">timeline</mat-icon>
      </div>
    </div>

    <div class="metro-tile tile-medium">
      <div class="tile-content">
        <mat-icon class="tile-icon">plus_one</mat-icon>
      </div>
    </div>

    <div class="metro-tile tile-medium">
      <div class="tile-content">
        <mat-icon class="tile-icon">exposure</mat-icon>
      </div>
    </div>

    <div class="metro-tile tile-wide">
      <div class="tile-content">
        <mat-icon class="tile-icon">insert_chart</mat-icon>
      </div>
    </div>

    <div class="metro-tile tile-medium">
      <div class="tile-content">
        <mat-icon class="tile-icon">square_foot</mat-icon>
      </div>
    </div>

    <div class="metro-tile tile-medium">
      <div class="tile-content">
        <mat-icon class="tile-icon">pie_chart</mat-icon>
      </div>
    </div>

    <div class="metro-tile tile-large">
      <div class="tile-content">
        <mat-icon class="tile-icon">straighten</mat-icon>
      </div>
    </div>

    <div class="metro-tile tile-medium">
      <div class="tile-content">
        <mat-icon class="tile-icon">architecture</mat-icon>
      </div>
    </div>

    <div class="metro-tile tile-medium">
      <div class="tile-content">
        <mat-icon class="tile-icon">leaderboard</mat-icon>
      </div>
    </div>

    <div class="metro-tile tile-wide">
      <div class="tile-content">
        <mat-icon class="tile-icon">analytics</mat-icon>
      </div>
    </div>

    <div class="metro-tile tile-medium">
      <div class="tile-content">
        <mat-icon class="tile-icon">show_chart</mat-icon>
      </div>
    </div>
  </div>
</div>
